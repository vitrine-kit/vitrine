name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Typecheck registry (copy-in feature files)
        run: pnpm typecheck:registry

      - name: Typecheck templates (pure zero-config + mappers)
        run: pnpm typecheck:templates

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Validate schemas (no drift vs committed)
        run: pnpm schemas && git diff --exit-code schemas

  # The CLI does FS-heavy, EOL-sensitive work on client machines — cover the
  # Windows-specific surface (paths, `where`, USERPROFILE, rmSync/renameSync).
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prefer pnpm's recursive filter over turbo on Windows: turbo has
      # exited 1 with zero task logs on trees that just passed the same
      # step on the PR (e.g. run 30177869478 after green 30177813590).
      # This job is about CLI FS behavior, not turbo itself.
      - name: Build CLI (with workspace deps)
        run: pnpm --filter "@vitrine-kit/vitrine..." build

      - name: Test CLI
        run: pnpm --filter @vitrine-kit/vitrine test
